title = "Mirolu Gitleaks Configuration"

[extend]
useDefault = true

[[rules]]
id = "age-secret-key"
description = "age private identity key"
regex = '''AGE-SECRET-KEY-1[QPZRY9X8GF2TVDW0S3JN54KHCE6MUA7L]{58}'''
tags = ["key", "age"]

[[rules]]
id = "tailscale-auth-key"
description = "Tailscale authentication, API, or OAuth client key"
regex = '''tskey-(auth|api|client)-[a-zA-Z0-9_-]{16,}'''
tags = ["key", "tailscale"]

[[allowlists]]
description = "Exclude compiled binary directory"
paths = [
  '''^bin/''',
]
